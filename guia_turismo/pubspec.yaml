name: guia_turismo
description: "Guia de turismo: login, listagem, cadastro e mapa de lugares consumindo uma API REST."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
