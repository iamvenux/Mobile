name: guia_turismo
description: "Guia de turismo rosa: login, câmera, lista, cadastro e mapa de destinos consumindo a API guia.liliaborges.com.br."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
